name: public-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_public_artifact.py
